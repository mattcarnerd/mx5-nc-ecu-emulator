name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests (synthetic only)
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Create executable
        run: python -m PyInstaller --onefile --windowed --name MX5-ECU-Workbench launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: mx5-ecu-workbench-windows
          path: dist/MX5-ECU-Workbench.exe
