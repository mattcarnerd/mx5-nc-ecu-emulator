name: Publish Windows prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Prerelease tag'
        required: true
        default: 'v0.1.0-alpha.1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    name: Test, package and publish Windows executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Windows executable
        run: python -m PyInstaller --onefile --windowed --name MX5-ECU-Workbench launch.py

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MX5-ECU-Workbench.exe release/MX5-ECU-Workbench.exe
          Compress-Archive -Path release/MX5-ECU-Workbench.exe -DestinationPath release/MX5_ECU_Workbench_Windows.zip -Force
          $hash = (Get-FileHash release/MX5-ECU-Workbench.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MX5-ECU-Workbench.exe" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          @'
          ### ECU Workbench v0.1 early development release

          This is a **prototype Windows application**, not a validated ECU emulator.

          - Load and inspect arbitrary binary ROM files
          - Inspect hexadecimal data, size, SHA-256 and entropy
          - Compare two ROM files and export a JSON report
          - Experimentally step a **limited** SuperH SH-2 integer instruction subset

          **Limitations:** loading a ROM does not mean its CPU or ECU can be emulated.
          No full ECU emulation, RAM/peripheral models, engine simulation, flashing,
          ECU communication or firmware safety validation is implemented.

          No manufacturer ROMs are included. Only use images you are entitled to inspect.
          The application is unsigned; Windows may show a SmartScreen warning.
          '@ | Set-Content -Path release/RELEASE_NOTES.md -Encoding utf8

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.1.0-alpha.1' }}
        run: |
          gh release create "$env:RELEASE_TAG" "release/MX5_ECU_Workbench_Windows.zip" "release/MX5-ECU-Workbench.exe" "release/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ECU Workbench $env:RELEASE_TAG" --notes-file "release/RELEASE_NOTES.md" --prerelease
