name: Publish NC Emulator Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, build, and publish a GitHub prerelease
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned independent SH instruction audit
        run: python -m pip install -r requirements-audit.txt

      - name: Run independent generated SH instruction audit
        run: python tools/audit_sh2_sleigh.py --synthetic --caller --path --output independent-sh2-audit.json

      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -v

      - name: Install Windows packager
        run: python -m pip install pyinstaller

      - name: Build portable Windows application
        run: python -m PyInstaller --onefile --windowed --name MX5-NC-ECU-Emulator launch.py

      - name: Smoke test packaged diagnostic CLI
        run: python tools/smoke_windows_exe.py dist/MX5-NC-ECU-Emulator.exe

      - name: Prepare downloadable release assets and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/MX5-NC-ECU-Emulator.exe release/MX5-NC-ECU-Emulator.exe
          Compress-Archive -Path release/MX5-NC-ECU-Emulator.exe -DestinationPath release/MX5_NC_ECU_Emulator_Windows.zip -Force
          $hash = (Get-FileHash release/MX5-NC-ECU-Emulator.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MX5-NC-ECU-Emulator.exe" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          @'
          ## MX-5 NC ECU Emulator — automatic development build

          Download **MX5-NC-ECU-Emulator.exe** from the Assets section below, or download the ZIP and extract the EXE.

          **Current capabilities:** load a locally owned Mazda MX-5 NC ROM;
          inspect probable image compatibility; execute an experimental
          reset-vector startup diagnostic with explicit virtual hardware input;
          export CPU and peripheral traces.

          **Not yet implemented:** full SH7058 instruction coverage,
          full firmware boot, sustained engine simulation, fuel/ignition outputs
          or certification of ECU firmware. ROM comparison has been removed
          (use NCFlash for that). No ROM binaries are included.

          This is an **unsigned, experimental Windows build**, not a
          validated ECU emulator and not an ECU flashing tool.
          '@ | Set-Content -Path release/RELEASE_NOTES.md -Encoding utf8

      - name: Publish versioned GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0-dev.${{ github.run_number }}.${{ github.run_attempt }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$env:RELEASE_TAG" "release/MX5-NC-ECU-Emulator.exe" "release/MX5_NC_ECU_Emulator_Windows.zip" "release/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:RELEASE_SHA" --title "NC ECU Emulator $env:RELEASE_TAG" --notes-file "release/RELEASE_NOTES.md" --prerelease
